<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렌트제이카 블로그 포스팅 생성기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f5; padding: 30px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 22px; }

        /* 한도 표시 박스 */
        .quota-box { background: #f0f7ff; border: 1px solid #b3d4ff; border-radius: 8px; padding: 14px 18px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }
        .quota-box .label { font-size: 13px; color: #555; }
        .quota-box .count { font-size: 15px; font-weight: bold; color: #2d6df6; }
        .quota-bar-wrap { margin-top: 8px; background: #dde8ff; border-radius: 10px; height: 8px; }
        .quota-bar { height: 8px; border-radius: 10px; background: #2d6df6; transition: width 0.3s; }
        .quota-warn { color: #e67e00; }
        .quota-danger { color: #e00; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #555; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        textarea { height: 80px; resize: vertical; }
        .btn { width: 100%; padding: 14px; background: #2d6df6; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #1a56d6; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        .required { color: red; margin-left: 3px; }

        /* 로딩 */
        .loading { display: none; text-align: center; padding: 16px; color: #2d6df6; font-weight: bold; font-size: 15px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #b3d4ff; border-top: 3px solid #2d6df6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <h1>🚗 렌트제이카 블로그 포스팅 생성기</h1>

    <!-- 무료 한도 표시 -->
    <div class="quota-box">
        <div style="flex:1">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="label">📊 오늘 남은 무료 한도</span>
                <span class="count" id="quotaText">로딩 중...</span>
            </div>
            <div class="quota-bar-wrap" style="margin-top:8px;">
                <div class="quota-bar" id="quotaBar" style="width:0%"></div>
            </div>
            <div style="font-size:11px; color:#888; margin-top:5px;">하루 최대 250회 / 매일 자정 초기화</div>
        </div>
    </div>

    <!-- 에러 메시지 -->
    <div th:if="${errorMsg}" style="background:#fff0f0; border:1px solid #ffb3b3; border-radius:8px; padding:14px 18px; margin-bottom:20px; color:#c00; font-size:14px; font-weight:bold;" th:text="${errorMsg}"></div>

    <form th:action="@{/generate}" th:object="${blogRequest}" method="post" id="blogForm">

        <div class="form-group">
            <label>차량 모델 <span class="required">*</span></label>
            <input type="text" th:field="*{carModel}" placeholder="예) 현대 아반떼 CN7 2024">
        </div>

        <div class="form-group">
            <label>월 렌탈료 <span class="required">*</span></label>
            <input type="text" th:field="*{monthlyFee}" placeholder="예) 350,000">
        </div>

        <div class="form-group">
            <label>계약 기간 <span class="required">*</span></label>
            <select th:field="*{contractPeriod}">
                <option value="">선택해주세요</option>
                <option value="12개월">12개월</option>
                <option value="24개월">24개월</option>
                <option value="36개월">36개월</option>
                <option value="48개월">48개월</option>
                <option value="60개월">60개월</option>
            </select>
        </div>

        <div class="form-group">
            <label>보증금 <span class="required">*</span></label>
            <input type="text" th:field="*{deposit}" placeholder="예) 0 또는 500,000">
        </div>

        <div class="form-group">
            <label>약정 주행거리 <span class="required">*</span></label>
            <select th:field="*{mileage}">
                <option value="">선택해주세요</option>
                <option value="월 1,000km">월 1,000km</option>
                <option value="월 1,500km">월 1,500km</option>
                <option value="월 2,000km">월 2,000km</option>
                <option value="월 3,000km">월 3,000km</option>
                <option value="무제한">무제한</option>
            </select>
        </div>

        <div class="form-group">
            <label>보험 종류 <span class="required">*</span></label>
            <select th:field="*{insuranceType}">
                <option value="">선택해주세요</option>
                <option value="일반보험">일반보험</option>
                <option value="완전자차">완전자차</option>
                <option value="자차+대물">자차+대물</option>
            </select>
        </div>

        <div class="form-group">
            <label>추가 옵션 (선택)</label>
            <textarea th:field="*{extraOptions}" placeholder="예) 하이패스 포함, 블랙박스 포함 등"></textarea>
        </div>

        <div class="loading" id="loading">
            <span class="spinner"></span> 블로그 글 생성 중... 잠시만 기다려주세요!
        </div>

        <button type="submit" class="btn" id="submitBtn">✍️ 블로그 글 생성하기</button>
    </form>
</div>

<script>
    // 사용 횟수 로컬 저장 (날짜 기준 초기화)
    function getQuotaData() {
        var today = new Date().toISOString().slice(0, 10);
        var saved = localStorage.getItem('quotaData');
        if (saved) {
            var data = JSON.parse(saved);
            if (data.date === today) return data;
        }
        var fresh = { date: today, used: 0 };
        localStorage.setItem('quotaData', JSON.stringify(fresh));
        return fresh;
    }

    function updateQuotaDisplay() {
        var data = getQuotaData();
        var remaining = 250 - data.used;
        var pct = (remaining / 250) * 100;
        var el = document.getElementById('quotaText');
        var bar = document.getElementById('quotaBar');

                        el.textContent = remaining + ' / 250 회 남음';
        bar.style.width = pct + '%';

        if (remaining <= 0) {
            el.className = 'count quota-danger';
            el.textContent = '오늘 한도 소진 ❌';
            bar.style.background = '#e00';
            document.getElementById('submitBtn').disabled = true;
        } else if (remaining <= 20) {
            el.className = 'count quota-warn';
            bar.style.background = '#e67e00';
        } else {
            el.className = 'count';
            bar.style.background = '#2d6df6';
        }
    }

    // 폼 제출 시 카운트 증가 + 로딩 표시
    document.getElementById('blogForm').addEventListener('submit', function() {
        var data = getQuotaData();
        data.used += 1;
        localStorage.setItem('quotaData', JSON.stringify(data));

        document.getElementById('loading').style.display = 'block';
        document.getElementById('submitBtn').disabled = true;
    });

    updateQuotaDisplay();
</script>
</body>
</html>
